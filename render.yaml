# Render Blueprint. Create the service with New > Blueprint and point it at this
# repository; Render reads this file and prompts for the secrets marked below.
services:
  - type: web
    name: youtube-qa-api
    runtime: node
    plan: free
    # Free plan regions: oregon, ohio, virginia, frankfurt, singapore.
    # Pick the one nearest you - it is the main lever on response latency.
    region: singapore
    rootDir: backend
    buildCommand: npm ci
    # Render injects $PORT; one Node process keeps the in-memory vector cache warm.
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22.20.0"
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      # Prompted on first deploy - never stored in the repo.
      - key: GROQ_API_KEY
        sync: false
      # Required even with LLM_PROVIDER=groq: it serves the embeddings.
      - key: GOOGLE_API_KEY
        sync: false
      # Your Vercel URL. *.vercel.app is already allowed by the API's CORS rule,
      # so this is only needed for a custom domain.
      - key: ALLOWED_ORIGINS
        sync: false
